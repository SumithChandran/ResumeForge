name: Build Resume PDF

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-extra

      - name: Select resume source
        run: |
          if [ -f "resume.tex" ]; then
            echo "Using resume.tex"
          elif [ -f "updated.tex" ]; then
            cp updated.tex resume.tex
            echo "Copied updated.tex to resume.tex"
          elif [ -f "updated" ]; then
            cp updated resume.tex
            echo "Copied updated to resume.tex"
          else
            echo "No resume source file found."
            exit 1
          fi

      - name: Build PDF
        run: make

      - name: Verify PDF output
        run: |
          test -s resume.pdf || { echo "resume.pdf was not generated."; exit 1; }

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: "*.pdf"